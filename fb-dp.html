<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FB Profile Picture — Learn AI Today</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px;font-family:'Poppins',sans-serif;gap:60px;flex-wrap:wrap}

.instructions{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.8);color:#fff;padding:12px 24px;border-radius:10px;
  font-size:13px;z-index:100;text-align:center;
}
.instructions strong{color:#F59E0B}

.label{text-align:center;color:rgba(255,255,255,0.4);font-size:12px;font-weight:600;margin-top:12px;letter-spacing:0.05em}

/* ===== OPTION 1: Logo mark ===== */
.dp{
  width:400px;height:400px;
  position:relative;overflow:hidden;
}

/* Option A: Text Logo */
.dp-logo{
  width:400px;height:400px;
  background:linear-gradient(135deg,#0F172A 0%,#1B2E5A 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.dp-logo .glow{
  position:absolute;width:300px;height:300px;border-radius:50%;
  background:radial-gradient(circle,rgba(3,105,161,0.25),transparent 60%);
  top:-50px;right:-50px;
}
.dp-logo .glow2{
  position:absolute;width:250px;height:250px;border-radius:50%;
  background:radial-gradient(circle,rgba(5,150,105,0.12),transparent 60%);
  bottom:-80px;left:-40px;
}
.dp-logo-content{position:relative;z-index:2;text-align:center}
.dp-logo-mark{
  width:100px;height:100px;
  background:linear-gradient(135deg,#0369A1,#0284c7);
  border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  font-size:38px;font-weight:900;color:#fff;
  margin:0 auto 20px;
  box-shadow:0 8px 32px rgba(3,105,161,0.4);
}
.dp-logo-name{font-size:36px;font-weight:900;color:#fff;letter-spacing:-0.02em;line-height:1}
.dp-logo-sub{font-size:13px;font-weight:600;color:rgba(255,255,255,0.4);letter-spacing:0.15em;text-transform:uppercase;margin-top:10px}

/* Option B: Photo with brand overlay */
.dp-photo{
  width:400px;height:400px;
  background:linear-gradient(135deg,#0F172A 0%,#1B2E5A 100%);
  position:relative;overflow:hidden;
}
.dp-photo img{width:100%;height:100%;object-fit:cover;object-position:top center}
.dp-photo-overlay{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(0deg,rgba(15,23,42,0.95) 0%,rgba(15,23,42,0.7) 40%,transparent 100%);
  padding:24px 20px 20px;text-align:center;
}
.dp-photo-name{font-size:24px;font-weight:800;color:#fff;letter-spacing:-0.01em}
.dp-photo-role{font-size:11px;font-weight:600;color:#7DD3FC;letter-spacing:0.1em;text-transform:uppercase;margin-top:4px}
.dp-photo-brand{
  position:absolute;top:16px;left:16px;
  background:rgba(3,105,161,0.2);border:1px solid rgba(3,105,161,0.3);
  border-radius:8px;padding:6px 12px;
  display:flex;align-items:center;gap:6px;
}
.dp-photo-brand-icon{
  width:22px;height:22px;background:linear-gradient(135deg,#0369A1,#0284c7);
  border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:900;color:#fff;
}
.dp-photo-brand-text{font-size:10px;font-weight:700;color:#7DD3FC}

/* Circle preview */
.circle-preview{
  width:176px;height:176px;border-radius:50%;overflow:hidden;
  border:3px solid rgba(255,255,255,0.1);margin:20px auto 0;
}
.circle-preview img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>

<div class="instructions">
  <strong>FB Profile Picture (400x400)</strong> — Screenshot the version you prefer. It will display as a circle on Facebook.
</div>

<!-- OPTION A: Logo (No Photo) -->
<div style="text-align:center">
  <div class="dp dp-logo" id="optionA">
    <div class="glow"></div>
    <div class="glow2"></div>
    <div class="dp-logo-content">
      <div class="dp-logo-mark">LAT</div>
      <div class="dp-logo-name">Learn AI</div>
      <div class="dp-logo-name" style="color:#38BDF8">Today</div>
      <div class="dp-logo-sub">AI Automation for Business</div>
    </div>
  </div>
  <div class="label">Option A: Logo (Clean & Corporate)</div>
</div>

<!-- OPTION B: Photo with overlay -->
<div style="text-align:center">
  <div class="dp dp-photo" id="optionB">
    <img src="./NirmalpicNew2.jpeg" alt="Nirmal">
    <div class="dp-photo-brand">
      <div class="dp-photo-brand-icon">LAT</div>
      <div class="dp-photo-brand-text">Learn AI Today</div>
    </div>
    <div class="dp-photo-overlay">
      <div class="dp-photo-name">Nirmal</div>
      <div class="dp-photo-role">AI Automation Consultant</div>
    </div>
  </div>
  <div class="label">Option B: Your Photo + Brand</div>
</div>

</body>
</html>
